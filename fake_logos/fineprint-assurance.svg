<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="Georgia, 'Times New Roman', serif">
  <rect width="680" height="220" fill="#ffffff"/>
  <!-- Asterisk mark in a square -->
  <g transform="translate(48,44)">
    <rect x="0" y="0" width="132" height="132" rx="8" fill="#1d3b34"/>
    <g transform="translate(66,66)" stroke="#e8e3d5" stroke-width="11" stroke-linecap="round">
      <line x1="0" y1="-38" x2="0" y2="38"/>
      <line x1="-33" y1="-19" x2="33" y2="19"/>
      <line x1="-33" y1="19" x2="33" y2="-19"/>
    </g>
  </g>
  <g transform="translate(216,0)">
    <text x="0" y="98" font-size="44" fill="#1d3b34" font-weight="bold">Fineprint</text>
    <text x="192" y="98" font-size="44" fill="#6b7a63" font-style="italic">Assurance</text>
    <line x1="3" y1="120" x2="405" y2="120" stroke="#1d3b34" stroke-width="2"/>
